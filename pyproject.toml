[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi==0.109.2",
    "great-expectations==0.17.22",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "pandas==2.1.3",
    "psycopg2-binary==2.9.10",
    "pyarrow==17.0.0",
    "python-dotenv==1.1.1",
    "requests==2.32.3",
    "scikit-learn==1.3.2",
    "sqlalchemy==2.0.25",
    "streamlit==1.30.0",
    "uvicorn==0.27.0",
]

[tool.ruff.lint.per-file-ignores]
"scripts/__init__.py" = ["N999"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["scripts", "sandbox", "agent.py", "tests"]

[dependency-groups]
dev = [
    "langgraph-sdk>=0.4.6,<0.5.0",
    "managed-deepagents>=0.9.0,<1.0.0",
    "pyright>=1.1.414",
    "pytest>=9,<10",
]
