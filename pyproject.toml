[project]
name = "data-agent"
version = "0.1.0"
description = "A LangChain Managed Deep Agent for exploratory data analysis"
readme = "ReadME.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "deepagents>=0.7.24,<0.8.0",
    "langchain>=1.0,<2",
    "langchain-groq>=1.1.3,<2",
    "langgraph-sdk>=0.4.6,<0.5.0",
    "managed-deepagents>=0.9.0,<1.0.0",
    "pandas>=2.1,<3",
    "plotly>=6.1.1,<7",
    "kaleido>=1.0.0,<2",
    "psycopg2-binary>=2.9.10,<3",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.1.1,<2",
    "requests>=2.32.3,<3",
    "sqlalchemy>=2.0.25,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.ruff]
extend-exclude = [".mda"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"scripts/__init__.py" = ["N999"]
"sandbox/__init__.py" = ["N999"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["scripts", "sandbox", "agent.py", "tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
